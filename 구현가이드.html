## 1. 전체 사이트맵 (GNB 2뎁스까지만) — 초기 설계안

참고 사이트는 6개 대메뉴 × 각 3~8개 소메뉴로 되어 있음. 울산정한의원은 요청하신 5개 진료과목 축으로 재구성:

```
자율신경계 → 근골격계질환
영양불균형 → 안면비대칭교정
체형불균형 → 피부질환
일반진료  → 한방다이어트
(신규)   → 교통사고 후유증
한의원 소개 (공통 유지)
진료예약 (공통 유지, 버튼형)
```

## 2. 공통 컴포넌트

### 2-1. 헤더 (모든 페이지 공통, sticky)
- 좌측: 로고 (심볼 + "울산정한의원" 워드마크 + 하단 영문 서브텍스트)
- 우측: GNB 6개 항목, 마우스 오버 시 2뎁스 드롭다운 노출
- 스크롤 시 상단 고정(sticky), 배경 흰색 유지
- 최우선 CTA(진료예약)는 버튼 스타일로 시각적으로 구분

### 2-2. 메인 히어로 — ⚠️ 참고 사이트와 다르게 갈 부분
- 참고 사이트는 대메뉴별 이미지가 자동 롤링되는 슬라이더 (자율신경/영양/체형 이미지가 순환)
- **울산정한의원은 롤링 없이 이미지 1장 + 카피 1세트로 고정**
  - 배경: 병원 대표 이미지 또는 원장 사진 1장 (정적, 애니메이션 없음)
  - 헤드카피 1줄 + 서브카피 1~2줄 (예: 핵심 소구점인 추나요법/턱관절 정렬 톤)
  - 버튼: "진료과목 보기", "진료예약" 2개 정도
  - 구현 시 슬라이더 라이브러리(swiper 등) 자체를 넣지 않는 게 유지보수도 편함

### 2-3. 주요 진료과목 섹션 (메인 페이지)
- 참고 사이트처럼 카드 4~5개 그리드 (아이콘 + 대메뉴명 + 소메뉴 해시태그 나열)
- 예: `근골격계질환` 카드 → `#추나요법 #목허리디스크 #오십견 #무릎관절염`
- 카드 클릭 시 해당 대메뉴 개요 페이지로 이동

### 2-4. 원장 소개 섹션 (메인 또는 "한의원 소개"에서 요약 노출)
- 사진 + 약력/학회/학술 3단 구성 (참고 사이트 형식)
- 정석환 원장 약력·학회 활동 내용 확정 후 채워 넣기

### 2-5. SNS/채널 섹션
- 네이버 블로그(jeonghani9975), 네이버 플레이스, 카카오채널 등 보유 채널만 노출 (없는 채널은 만들지 않음)

### 2-6. 푸터 (모든 페이지 공통)
- 병원명, 대표자, 내원 주소, 사업자등록번호, 대표번호/팩스
- 진료시간 표
- 소셜 링크
- 비급여 진료안내 (필요 시)
- 하단 카피라이트

### 2-7. 플로팅 버튼
- 우측 하단 고정, 카카오톡 상담 or 전화 연결 버튼 1개

## 3. 서브페이지(2뎁스) 공통 템플릿

모든 소메뉴 페이지는 아래 구조를 재사용:

1. 서브 히어로 (작은 배너, 페이지 제목 + brotherhood 카테고리 위치 표시: `홈 > 근골격계질환 > 추나요법`)
2. 증상/개념 설명 섹션
3. 원인 or 특징 설명 섹션
4. 울산정한의원만의 치료 접근법 (핵심 소구점 강조 박스)
5. 치료 과정/절차 (스텝 형태)
6. 관련 소메뉴 링크 (같은 대메뉴 내 다른 항목 3개 추천)
7. 하단 CTA (진료예약 유도)
8. 공통 푸터

| 용도 | 색상 | 코드(예시) |

| 보조 컬러 | 세이지 그린 | #7C8B6E |

- 폰트: 국문 본문은 시스템 산세리프(Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR) 위주 권장. 참고 사이트는 명조 계열(RIDIBatang)을 헤딩에 쓰는데, 가독성 우선이면 헤딩도 산세리프로 통일 추천.
- 반응형 브레이크포인트: 1024px(태블릿), 768px(모바일 큰 화면), 480px(모바일 작은 화면) 3단 권장. 모바일에서는 GNB를 햄버거 메뉴 + 아코디언(2뎁스 펼침)으로 전환.
